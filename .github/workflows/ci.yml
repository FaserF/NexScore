name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: FaserF/repo-template/.github/workflows/reusable-ci.yml@b1bdea2c2dd4717ff8338b73cc629a363fce5f2a # v1
    with:
      project_type: "generic"
    secrets: inherit
